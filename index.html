<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e9">
  <title>Прованс — меню</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f2e9;
      --ink: #493b54;
      --line: #ccbccc;
      --accent: #725681;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: #eee7ea;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-block-size: 100vh;
      min-block-size: 100svh;
      margin: 0;
      padding: 1.5rem;
      place-items: center;
      background: radial-gradient(ellipse at top, #f8f4ed, #eee7ea 78%);
    }

    main {
      inline-size: min(100%, 30rem);
      padding: 0 2.5rem 3.5rem;
      border: 1px solid #ded1d9;
      background: var(--paper);
      box-shadow: 0 18px 50px #493b5412;
    }

    h1 {
      margin: 0;
    }

    .brand {
      display: block;
      inline-size: min(100%, 21.25rem);
      block-size: auto;
      margin-inline: auto;
    }

    nav {
      max-inline-size: 21.25rem;
      margin-inline: auto;
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin: 0.5rem 0 1.15rem;
      color: var(--accent);
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h2::before,
    h2::after {
      flex: 1;
      block-size: 1px;
      background: var(--line);
      content: "";
    }

    ul {
      display: grid;
      gap: 0.75rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-block-size: 3.75rem;
      padding: 0.75rem 1.2rem;
      border: 1px solid var(--line);
      border-radius: 0.25rem;
      background: #fbf7f0;
      color: inherit;
      font-size: 1.375rem;
      text-decoration: none;
    }

    a:hover,
    a:active {
      border-color: var(--accent);
      background: #f1e8f1;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .arrow {
      color: var(--accent);
      font-family: system-ui, sans-serif;
      font-size: 1.125rem;
    }

    @media (max-width: 34rem) {
      body {
        padding: 0;
        align-items: start;
        background: var(--paper);
      }

      main {
        inline-size: 100%;
        padding-inline: clamp(1.125rem, 7vw, 2.5rem);
        border: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1><img class="brand" src="brand.webp" alt="Кафе «Прованс»" width="680" height="556"></h1>
    <nav aria-labelledby="menu-heading">
      <h2 id="menu-heading">Меню</h2>
      <ul>
        <li><a href="menu.pdf">Суши <span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a href="menu.pdf">Основное <span class="arrow" aria-hidden="true">→</span></a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
